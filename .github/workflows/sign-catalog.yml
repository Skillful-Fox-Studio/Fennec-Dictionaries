name: Sign dictionary catalog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dictionary-publication
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main' && github.repository == 'Skillful-Fox-Studio/Fennec-Dictionaries'
    environment: dictionary-publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify catalog and public assets
        run: node scripts/preflight.mjs
      - name: Sign with protected environment secret
        env:
          FENNEC_DICTIONARY_SIGNING_KEY: ${{ secrets.FENNEC_DICTIONARY_SIGNING_KEY }}
        run: node scripts/sign.mjs publication/catalog-input.json dist/catalog-signed.json fennec-dictionaries-1
      - name: Store signed catalog temporarily
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-dictionary-catalog
          path: dist/catalog-signed.json
          if-no-files-found: error
          retention-days: 7
