name: Stage DE and ES dictionaries
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dictionary-publication
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main' && github.repository == 'Skillful-Fox-Studio/Fennec-Dictionaries'
    environment: dictionary-publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - name: Build packages from pinned upstream sources
        run: |
          npm run build:de
          npm run build:es
      - name: Store candidates temporarily
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: de-es-dictionary-candidates
          path: |
            dist/de-DE-20161207-fennec.1/dictionary-de-DE-20161207-fennec.1.json
            dist/de-DE-20161207-fennec.1/UPSTREAM-LICENSE.txt
            dist/de-DE-20161207-fennec.1/UPSTREAM-SOURCE.tar.bz2
            dist/es-ES-2.8-fennec.1/dictionary-es-ES-2.8-fennec.1.json
            dist/es-ES-2.8-fennec.1/UPSTREAM-LICENSE.txt
            dist/es-ES-2.8-fennec.1/UPSTREAM-SOURCE.zip
          if-no-files-found: error
          retention-days: 7
